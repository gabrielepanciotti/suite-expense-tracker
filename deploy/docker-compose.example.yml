services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: expensetracker
      POSTGRES_USER: expensetracker
      POSTGRES_PASSWORD: example-not-a-secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensetracker -d expensetracker"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - expense_tracker_data:/var/lib/postgresql/data

  backend:
    image: python:3.13-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir /Life/packages/shared /Life/packages/backend-core -r backend/requirements.txt &&
      alembic -c backend/alembic.ini upgrade head &&
      uvicorn expense_tracker_backend.app:app --host 0.0.0.0 --port 10024"
    environment:
      DATABASE_URL: postgresql+psycopg://expensetracker:example-not-a-secret@database:5432/expensetracker
      FINANCE_URL: ${FINANCE_URL:-http://host.docker.internal:10023}
      PYTHONPATH: /app/backend
    ports:
      - "10024:10024"
    volumes:
      - ..:/app
      - ../Life/packages/shared:/Life/packages/shared:ro
      - ../Life/packages/backend-core:/Life/packages/backend-core:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy

volumes:
  expense_tracker_data:
