name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIFE_FRAMEWORK_REPO || 'suite-life' }}
          path: Life
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./../Life/packages/shared ./../Life/packages/backend-core
          python -m pip install -r backend/requirements-dev.txt
      - name: Test
        working-directory: repo
        run: PYTHONPATH=backend python -m pytest
      - name: Lint
        working-directory: repo
        run: PYTHONPATH=backend python -m ruff check backend/expense_tracker backend/expense_tracker_backend tests
